server {
  listen 80;
  server_name _;
  resolver 127.0.0.11 valid=10s ipv6=off;

  location = /jellyfin {
    return 301 $scheme://$http_host/jellyfin/;
  }

  location /jellyfin/ {
    set $jellyfin_upstream jellyfin:8096;
    rewrite ^/jellyfin/?(.*)$ /$1 break;
    proxy_pass http://$jellyfin_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Prefix /jellyfin;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_buffering off;
  }

  location = /qbittorrent {
    return 301 $scheme://$http_host/qbittorrent/;
  }

  location /qbittorrent/ {
    if ($arg_username != "") {
      return 302 $scheme://$http_host/qbittorrent/;
    }
    if ($arg_password != "") {
      return 302 $scheme://$http_host/qbittorrent/;
    }
    set $qbittorrent_upstream qbittorrent:18081;
    rewrite ^/qbittorrent/?(.*)$ /$1 break;
    proxy_pass http://$qbittorrent_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_set_header X-Forwarded-Prefix /qbittorrent;
    proxy_set_header X-Script-Name /qbittorrent;
    proxy_redirect / /qbittorrent/;
    proxy_cookie_path / /qbittorrent/;
  }

  location /api/ {
    set $api_upstream api:8000;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    set $frontend_upstream frontend:4173;
    proxy_pass http://$frontend_upstream$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
